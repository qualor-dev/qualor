<q-auth-layout>
  <form class="card auth-card" method="post" (submit)="submit($event)">
    <h1 i18n="@@password.title">Change your password</h1>
    @if (forced()) {
      <p class="alert alert-info" role="status" i18n="@@password.forced">
        An administrator set your password. Choose your own before you continue.
      </p>
    }
    @if (error(); as message) {
      <p class="alert alert-error" role="alert">{{ message }}</p>
    }
    <input
      type="text"
      name="username"
      autocomplete="username"
      hidden
      readonly
      [value]="username()"
    />
    <div class="field">
      <label for="password-current" i18n="@@password.current">Current password</label>
      <input
        id="password-current"
        type="password"
        autocomplete="current-password"
        required
        [attr.aria-invalid]="currentError() ? true : null"
        [attr.aria-describedby]="currentError() ? 'password-current-error' : null"
        [value]="current()"
        (input)="current.set(inputValue($event))"
      />
      @if (currentError(); as message) {
        <span id="password-current-error" class="field-error">{{ message }}</span>
      }
    </div>
    <div class="field">
      <label for="password-new" i18n="@@password.new">New password</label>
      <input
        id="password-new"
        type="password"
        autocomplete="new-password"
        required
        [attr.minlength]="minLength"
        aria-describedby="password-new-hint"
        [attr.aria-invalid]="nextError() ? true : null"
        [value]="next()"
        (input)="next.set(inputValue($event))"
      />
      <span id="password-new-hint" class="hint" i18n="@@password.hint"
        >At least {{ minLength }} characters.</span
      >
      @if (nextError(); as message) {
        <span class="field-error" role="alert">{{ message }}</span>
      }
    </div>
    <div class="field">
      <label for="password-confirm" i18n="@@password.confirm">Repeat the new password</label>
      <input
        id="password-confirm"
        type="password"
        autocomplete="new-password"
        required
        [value]="confirm()"
        (input)="confirm.set(inputValue($event))"
      />
    </div>
    <button
      type="submit"
      class="btn btn-primary"
      [attr.aria-disabled]="busy() ? true : null"
      i18n="@@password.submit"
    >
      Change password
    </button>
    <p class="auth-alt">
      <button type="button" class="btn-quiet" (click)="signOut()" i18n="@@password.signOut">
        Sign out
      </button>
    </p>
  </form>
</q-auth-layout>
