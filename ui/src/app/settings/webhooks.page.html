<div class="settings-head">
  <div>
    <h2 tabindex="-1" i18n="@@webhooks.title">Webhooks</h2>
    @if (!canRead()) {
      <p class="muted" i18n="@@webhooks.adminsOnly">
        Only organization administrators manage webhooks.
      </p>
    } @else {
      <p class="muted" i18n="@@webhooks.intro">
        Qualor posts a signed JSON message to each active webhook when an analysis completes or a
        quality gate status changes, for every project of the organization.
      </p>
    }
  </div>
</div>
@if (canRead()) {
  <q-webhook-list [organizationId]="org.currentId()" [canManage]="canManage()" />
}
