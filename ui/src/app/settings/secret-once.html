<div class="alert alert-success secret-once">
  <p id="secret-once-warning" i18n="@@secret.once">Copy it now: it is shown only this once.</p>
  <div class="row">
    <label for="secret-once" class="visually-hidden">{{ label() }}</label>
    <input
      #field
      id="secret-once"
      aria-describedby="secret-once-warning"
      readonly
      size="48"
      autocomplete="off"
      spellcheck="false"
      [value]="value()"
      (focus)="field.select()"
    />
    <button type="button" class="btn" (click)="copy()" i18n="@@secret.copy">Copy</button>
    @if (showDone()) {
      <button type="button" class="btn" (click)="done.emit()" i18n="@@secret.done">Done</button>
    }
  </div>
  <p aria-live="polite">
    @switch (copyState()) {
      @case ('copied') {
        <span i18n="@@secret.copied">Copied.</span>
      }
      @case ('failed') {
        <span i18n="@@secret.copyFailed"
          >Copying failed: select the text and copy it yourself.</span
        >
      }
    }
  </p>
</div>
