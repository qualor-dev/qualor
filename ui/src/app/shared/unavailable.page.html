<q-auth-layout art="offline">
  <div class="card auth-card">
    <h1 i18n="@@unavailable.title">Qualor is not available</h1>
    <p class="alert alert-error" role="alert" i18n="@@unavailable.body">
      The server could not be reached. Check your connection and try again.
    </p>
    <button type="button" class="btn btn-primary" (click)="retry()" i18n="@@unavailable.retry">
      Try again
    </button>
  </div>
</q-auth-layout>
