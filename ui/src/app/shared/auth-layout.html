<!-- The main landmark is the card's column; the brand panel is a complementary aside. -->
<div class="auth-page">
  <aside class="auth-art" [class.offline]="art() === 'offline'">
    <span class="brand">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#1f5fbf" />
        <path
          d="M16 7a9 9 0 1 0 5.3 16.3l3.2 3.2 2.1-2.1-3.2-3.2A9 9 0 0 0 16 7zm0 3a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"
          fill="#fff"
        />
      </svg>
      <span i18n="@@auth.brand">Qualor</span>
    </span>
    <p class="tagline" i18n="@@auth.tagline">
      Open-source code quality for teams that host their own GitLab or GitHub.
    </p>
    <div class="auth-illustration" aria-hidden="true"></div>
  </aside>
  <main class="auth-main">
    <ng-content />
  </main>
</div>
