<figure class="trend">
  <figcaption class="metric-label">{{ title() }}</figcaption>
  <span class="trend-latest" aria-hidden="true">{{ latest() }}</span>
  <svg role="img" [attr.aria-label]="summary()" [attr.viewBox]="viewBox" preserveAspectRatio="none">
    @if (path(); as path) {
      <polygon [attr.points]="path.area" fill="currentColor" fill-opacity="0.1" />
      <polyline
        [attr.points]="path.line"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        vector-effect="non-scaling-stroke"
      />
      <circle [attr.cx]="path.lastX" [attr.cy]="path.lastY" r="3" fill="currentColor" />
    }
  </svg>
  <details>
    <summary i18n="@@trend.values">Values</summary>
    <table>
      <thead>
        <tr>
          <th scope="col" i18n="@@trend.date">Date (UTC)</th>
          <th scope="col" class="num" i18n="@@trend.value">Value</th>
        </tr>
      </thead>
      <tbody>
        @for (point of shown(); track $index) {
          <tr>
            <td>{{ point.date | dateTime: 'date' }}</td>
            <td class="num">{{ point.value | measure: metric() }}</td>
          </tr>
        }
      </tbody>
    </table>
  </details>
</figure>
