<div
  class="meter"
  [class.reached]="tone() === 'failure'"
  [class.attention]="tone() === 'attention'"
  [class.off]="state() === 'off'"
>
  <div class="meter-head">
    <span class="meter-label">{{ label() }}</span
    >&ngsp;<span class="meter-value">{{ valueText() }}</span>
  </div>
  @if (max() !== null) {
    <div
      class="meter-track"
      role="meter"
      aria-valuemin="0"
      [attr.aria-label]="label()"
      [attr.aria-valuenow]="trackValue()"
      [attr.aria-valuemax]="max()"
      [attr.aria-valuetext]="spoken()"
    >
      <span class="meter-fill" [style.width.%]="percent()"></span>
    </div>
  }
  @if (noteText(); as note) {
    <span class="meter-note">
      @if (tone() !== null) {
        <q-icon name="alert" />
      }
      {{ note }}
    </span>
  }
</div>
