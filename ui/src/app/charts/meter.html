<div class="meter" [class.reached]="state() === 'reached'" [class.off]="state() === 'off'">
  <div class="meter-head">
    <span class="meter-label">{{ label() }}</span
    >&ngsp;<span class="meter-value">{{ valueText() }}</span>
  </div>
  @if (max() !== null) {
    <div
      class="meter-track"
      role="meter"
      aria-valuemin="0"
      [attr.aria-label]="label()"
      [attr.aria-valuenow]="value()"
      [attr.aria-valuemax]="max()"
      [attr.aria-valuetext]="spoken()"
    >
      <span class="meter-fill" [style.width.%]="percent()"></span>
    </div>
  }
  @if (note(); as note) {
    <span class="meter-note">
      @if (state() === 'reached') {
        <q-icon name="alert" />
      }
      {{ note }}
    </span>
  }
</div>
