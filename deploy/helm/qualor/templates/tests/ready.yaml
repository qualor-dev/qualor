apiVersion: v1
kind: Pod
metadata:
  name: {{ include "qualor.fullname" . }}-test-ready
  labels:
    {{- include "qualor.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    {{- include "qualor.podSecurity" . | nindent 4 }}
  containers:
    - name: ready
      image: {{ include "qualor.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - /usr/local/bin/node
        - -e
        - {{ printf "fetch('http://%s:%v/readyz').then(r=>process.exit(r.status===200?0:1),()=>process.exit(1))" (include "qualor.fullname" .) .Values.service.port | quote }}
      securityContext:
        {{- include "qualor.containerSecurity" . | nindent 8 }}
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 128Mi }
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    {{- include "qualor.tmpVolume" "64Mi" | nindent 4 }}
