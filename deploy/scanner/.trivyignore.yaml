  # PMD 7.27.0 bundles the all-in-one jline 3.21.0 jar; PMD uses its terminal only, never the
  # builtins or the telnet server. PMD 7.28.0 ships jline-terminal 3.29.0 alone (a bump that needs
  # its sources re-derived, deploy/README.md).
  - id: CVE-2026-77422
    paths: ['opt/qualor/lib/pmd-bin-*/lib/jline-*.jar']
    statement: jline-builtins in PMD's jline 3.21.0 jar; PMD never uses the builtins.
    expired_at: 2026-12-31
  - id: CVE-2026-56740
    paths: ['opt/qualor/lib/pmd-bin-*/lib/jline-*.jar']
    statement: jline-remote-telnet in PMD's jline 3.21.0 jar; PMD never starts a telnet server.
    expired_at: 2026-12-31
  - id: CVE-2026-56741
    paths: ['opt/qualor/lib/pmd-bin-*/lib/jline-*.jar']
    statement: jline-remote-telnet in PMD's jline 3.21.0 jar; PMD never starts a telnet server.
    expired_at: 2026-12-31

  # Trivy 0.74.0 (the latest release) compiles in gRPC 1.82.1; Qualor runs `trivy fs` offline,
  # never Trivy's client/server mode, which is what speaks gRPC.
  - id: CVE-2026-84304
    paths: ['opt/qualor/bin/trivy']
    statement: gRPC in Trivy 0.74.0, the latest release; Qualor never uses Trivy's client/server mode.
    expired_at: 2026-12-31
  - id: CVE-2026-84445
    paths: ['opt/qualor/bin/trivy']
    statement: gRPC in Trivy 0.74.0, the latest release; Qualor never uses Trivy's client/server mode.
    expired_at: 2026-12-31

