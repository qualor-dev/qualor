# HIGH and CRITICAL vulnerabilities accepted in qualor/scanner and qualor/scanner-dotnet (built from
# qualor/scanner), each with the reason and a review date: `expired_at` makes Trivy report it again
# from that day, so a lapsed entry fails the scan instead of hiding a finding. Scan an image with:
#   trivy image --severity HIGH,CRITICAL --ignorefile deploy/scanner/.trivyignore.yaml qualor/scanner:<tag>
# (deploy/README.md). It is about the images only, so it stays out of the repository root, where
# the ignore file of Qualor's own Trivy scan of this repository belongs.
vulnerabilities:
  # Debian bookworm packages of the base image (node:*-bookworm-slim) and of git, with no fixed
  # package in Debian yet ("affected", "fix_deferred" or "will_not_fix"). They leave with the next
  # base image digest that carries a fix.
  - id: CVE-2026-13221
    statement: perl (git's dependency); no Debian fix. Qualor never runs perl.
    expired_at: 2026-12-31
  - id: CVE-2026-8376
    statement: perl; 32-bit builds only, the image is 64-bit; no Debian fix.
    expired_at: 2026-12-31
  - id: CVE-2026-42496
    statement: perl Archive::Tar; no Debian fix. Qualor never runs perl.
    expired_at: 2026-12-31
