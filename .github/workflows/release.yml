name: release
# Publishing. Started only by a person (workflow_dispatch). The dry run
# needs no secret. The publish job needs publish: true, the tag v<version> as the ref, the typed
# confirmation "publish v<version>", and the protected environment "release" with its reviewers
# and secrets, which do not exist until the maintainer creates them. pnpm release:publish
# checks all of it again before it runs any command. Nothing goes to the Rekor transparency log
# (default off: REKOR_FOR_REAL_RELEASES in tools/release/publish.ts).
# tools/release/gating.test.ts keeps all of this in place.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (x.y.z); run this on the tag v<version>'
        required: true
        type: string
      publish:
        description: 'Publish after the dry run (needs the release environment)'
        required: true
        type: boolean
        default: false
      confirm:
        description: 'To publish, type: publish v<version>'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      # Every tag: the moving image tags depend on the versions already released (releasedVersions).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.3.13 }
      - run: pnpm install --frozen-lockfile
      # The five images need about 20 GB; the runner's preinstalled SDKs make room.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: pnpm deploy:sources
      - run: pnpm release:dry-run --version "$VERSION"
        env: { VERSION: '${{ inputs.version }}' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: release-dry-run, path: .tmp/release/, retention-days: 7 }

  publish:
    needs: dry-run
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish &&
      github.ref_type == 'tag' && github.ref_name == format('v{0}', inputs.version) &&
      inputs.confirm == format('publish v{0}', inputs.version)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.3.13 }
      - run: pnpm install --frozen-lockfile
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: pnpm deploy:sources
      - run: pnpm release:dry-run --version "$VERSION"
        env: { VERSION: '${{ inputs.version }}' }
      - run: pnpm release:publish
        env:
          QUALOR_RELEASE_CONFIRM: '${{ inputs.confirm }}'
          DOCKERHUB_USERNAME: '${{ secrets.DOCKERHUB_USERNAME }}'
          DOCKERHUB_TOKEN: '${{ secrets.DOCKERHUB_TOKEN }}'
          COSIGN_PRIVATE_KEY: '${{ secrets.COSIGN_PRIVATE_KEY }}'
          COSIGN_PASSWORD: '${{ secrets.COSIGN_PASSWORD }}'
          GH_TOKEN: '${{ github.token }}'
