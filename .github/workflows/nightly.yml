name: nightly
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # CLI step 14 (brief §2.1, plan 1D ruling K1): `qualor scan` on 300 184 generated lines of
  # TypeScript in < 60 s, warm, analyzers excluded, timed with the compiled binary. Offline: the
  # repository is generated from a fixed seed and scanned with --dry-run. Actions are pinned to
  # commit SHAs (the tag each one had is in the comment).
  benchmark:
    runs-on: ubuntu-latest
    # The scan takes about a minute; a hung run must not hold a runner for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.3.13 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qualor/cli build linux-x64
      - run: pnpm bench
        env: { QUALOR_BIN: cli/dist/qualor-linux-x64 }
