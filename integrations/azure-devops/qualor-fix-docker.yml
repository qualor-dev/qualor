# Qualor dependency fix pull requests in Azure Pipelines (docker run, no extension).
# Copy this file to azure-pipelines-fix.yml and add it as a second pipeline, next to the scan.
#
# Set two pipeline variables (Pipelines, Edit, Variables):
#   - QUALOR_URL: your Qualor server;
#   - QUALOR_TOKEN: a project analysis token of the Qualor project, marked as a secret.
# A personal token is refused: the fix run needs a project analysis token.
# The job needs a Linux agent with Docker. It runs on the main branch only, on each push and
# daily; change `main` to your default branch in all three places.
# `qualor fix` claims the fixes that people or the automatic mode requested, runs your package
# managers in a scratch copy of the checkout and uploads the changed manifests and lockfiles. The
# Qualor server opens the pull requests. It never changes the checkout.
# The scanner image has npm, Yarn classic and Go. For pnpm, Yarn Berry, Maven, uv or Poetry, run
# `qualor fix` in an image that has them (copy the binary out of the scanner image).
# The checkout fetches the full history and does not leave the build's token in .git/config,
# where the package managers' scripts could read it.
# Its documentation: https://qualor.dev/docs/azure-devops
# The image tag is fixed: nothing floats. QUALOR_TOKEN reaches docker through the step's
# environment (-e QUALOR_TOKEN) and is never written into a script.
trigger:
  branches:
    include: [main]

pr: none

schedules:
  - cron: '17 3 * * *'
    displayName: Daily fix run
    branches:
      include: [main]
    always: true

pool:
  vmImage: ubuntu-latest

variables:
  QUALOR_SCANNER_IMAGE: qualor/scanner:0.16

steps:
  - checkout: self
    fetchDepth: 0
    persistCredentials: false

  - script: mkdir -p "$(Agent.TempDirectory)/qualor-home"
    displayName: Prepare the scanner home

  - script: |
      set -euo pipefail
      docker run --rm --user "$(id -u):$(id -g)" \
        -v "$(Build.SourcesDirectory):/src" -w /src \
        -v "$(Agent.TempDirectory)/qualor-home:/qualor-home" -e HOME=/qualor-home \
        -e GIT_CONFIG_GLOBAL=/dev/null -e PYTHONNOUSERSITE=1 \
        -e TF_BUILD -e BUILD_REPOSITORY_PROVIDER -e BUILD_REASON \
        -e BUILD_SOURCEBRANCH -e BUILD_SOURCEVERSION -e BUILD_BUILDID \
        -e BUILD_REPOSITORY_ID -e BUILD_REPOSITORY_NAME -e SYSTEM_TEAMPROJECT \
        -e SYSTEM_TEAMPROJECTID -e SYSTEM_COLLECTIONURI -e SYSTEM_PULLREQUEST_PULLREQUESTID \
        -e SYSTEM_PULLREQUEST_SOURCEBRANCH -e SYSTEM_PULLREQUEST_TARGETBRANCH \
        -e SYSTEM_PULLREQUEST_SOURCECOMMITID \
        -e QUALOR_URL -e QUALOR_TOKEN -e QUALOR_PROJECT_KEY \
        $(QUALOR_SCANNER_IMAGE) fix
    displayName: Qualor fix
    env:
      QUALOR_TOKEN: $(QUALOR_TOKEN)
