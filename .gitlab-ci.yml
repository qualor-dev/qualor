workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

default:
  image: node:22-bookworm
  interruptible: true
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

stages: [check]

# The pinned analyzer toolchain (tools/analyzers/install.sh) plus a JDK for PMD, SpotBugs and the
# fixture's javac, and PHP 8.2 for PHPStan (plan 9A). QUALOR_REQUIRE_ANALYZERS=1 turns a missing tool into a failure (ruling T4).
# Trivy's release archive and database layer are cached by the database pin (plan 2B): the
# key is TRIVY_DB_DIGEST of install.sh without its `sha256:` (`pnpm trivy-db:pin` moves both), and
# install.sh checks every cached file's SHA-256 before it uses it. Upstream's retention of old
# snapshots is not documented; the cache keeps the pinned one installable while it lives.
.analyzers:
  variables:
    QUALOR_REQUIRE_ANALYZERS: '1'
    QUALOR_DOWNLOAD_CACHE: .tmp/downloads
    QUALOR_TRIVY_DB_SHA256: 7d0ae3ee84ece1ecae274d9ac146c7241ae483c981f68aeb3f4953f6c2fbc6b0
  cache:
    - key:
        files: [pnpm-lock.yaml]
      paths: [.pnpm-store]
    - key: trivy-db-$QUALOR_TRIVY_DB_SHA256
      paths: [.tmp/downloads]
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends openjdk-17-jdk-headless unzip php8.2-cli
    - sh tools/analyzers/install.sh
    - sh tools/analyzers/install-sonarjs.sh
    - sh tools/analyzers/install-weblint.sh
    - !reference [default, before_script]

lint:
  stage: check
  script:
    - pnpm lint
    - pnpm format:check
    - pnpm --filter @qualor/server db:check
    - pnpm --filter @qualor/server db:generate
    - git diff --exit-code -- server/drizzle
    - test -z "$(git status --porcelain -- server/drizzle)"
    - pnpm --filter @qualor/ui i18n:extract
    - git diff --exit-code -- ui/src/locale

typecheck:
  stage: check
  script:
    - pnpm typecheck

test:
  extends: .analyzers
  stage: check
  services:
    - name: postgres:18-alpine
      alias: postgres
  variables:
    QUALOR_REQUIRE_ANALYZERS: '1'
    POSTGRES_PASSWORD: postgres
    QUALOR_TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
  script:
    - pnpm test:coverage
  coverage: '/All files\s*\|\s*([\d.]+)/'
  artifacts:
    # The dogfood job imports it with its scan (qualor.yml).
    paths: [coverage/lcov.info]
    expire_in: 1 week

audit:
  stage: check
  script:
    - pnpm audit --audit-level high

fixtures:
  extends: .analyzers
  stage: check
  script:
    - pnpm fixtures

cli-binary:
  extends: .analyzers
  stage: check
  services:
    - name: postgres:18-alpine
      alias: postgres
  variables:
    POSTGRES_PASSWORD: postgres
    QUALOR_TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
  script:
    - npm install -g bun@1.3.13
    - pnpm --filter @qualor/cli build
    - pnpm --filter @qualor/cli smoke
    - pnpm --filter @qualor/cli smoke:process
    - pnpm --filter @qualor/cli smoke:upload
    - pnpm --filter @qualor/cli smoke:autoload
    - QUALOR_BIN=cli/dist/qualor-linux-x64 pnpm fixtures
    - QUALOR_BIN=cli/dist/qualor-linux-x64 pnpm exec vitest run --project db server/test/cli-e2e.db.test.ts
  artifacts:
    paths: [cli/dist/]
    expire_in: 1 week

# DCO (CONTRIBUTING.md): every commit of a merge request, merges excepted, carries a
# Signed-off-by line naming its author. It only reads git (the whole history: GIT_DEPTH 0) and
# needs no secret. Unverified until the first push.
dco:
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: '0'
  script:
    - pnpm exec tsx tools/release/dco.ts "$CI_MERGE_REQUEST_DIFF_BASE_SHA" "$CI_COMMIT_SHA"

# Plan 4A: the chart's render tests with the pinned Helm of tools/release/install-tools.sh, run
# directly in the job container (QUALOR_TOOLBOX=direct), since the job cannot start containers.
# The k3s smoke test runs on GitHub Actions only.
helm:
  stage: check
  variables:
    QUALOR_TOOLBOX: direct
  before_script:
    - sh tools/release/install-tools.sh
    - !reference [default, before_script]
  script:
    - export PATH=/opt/qualor-release/bin:$PATH
    - pnpm helm:test

# Plan 1F: the UI against a real server with seeded data. The Playwright image of the pinned
# version carries its Chromium; the Postgres service replaces Testcontainers. The image's own Node
# is 24; the job installs the Node 22 LTS every other job uses (exact version, SHA-256 checked).
ui-e2e:
  stage: check
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  timeout: 20 minutes
  services:
    - name: postgres:18-alpine
      alias: postgres
  variables:
    NODE_VERSION: 22.23.3
    NODE_SHA256: 1084aa36196bba4c3a5e69a1ee388a6e4ff729dad09445fbcd434b28fe3c24af
    POSTGRES_PASSWORD: postgres
    QUALOR_TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
  before_script:
    - curl -fsSL --proto '=https' --tlsv1.2 -o /tmp/node.tar.gz "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.gz"
    - echo "${NODE_SHA256}  /tmp/node.tar.gz" | sha256sum -c -
    - tar -xzf /tmp/node.tar.gz -C /usr/local --strip-components=1 --no-same-owner
    - test "$(node -v)" = "v${NODE_VERSION}"
    - !reference [default, before_script]
  script:
    - pnpm ui:e2e
    - pnpm ui:screenshots
  artifacts:
    when: always
    paths: [.tmp/playwright/, .tmp/screenshots/]
    expire_in: 1 week

# Plan 1G (brief rule 4): Qualor scans itself with the images this pipeline builds, against a
# throwaway server (the compose stack with secrets generated for this run, the project and its
# token created through the API and never printed; GitLab can only mask variables set in its
# settings), with the default gate. The job's exit code is the head scan's, so it fails when the
# gate fails. It also runs the compose smoke test. Docker-in-Docker: the runner must allow
# privileged services; the daemon, its TLS certificates and everything on it live only as long as
# the job. The stack publishes its port on the dind daemon (QUALOR_BIND_ADDRESS,
# QUALOR_DEPLOY_HOST) and the scans read the checkout from a volume. after_script removes whatever
# a failed or cancelled run left behind (tools/deploy/teardown.sh: only the qualor-* stacks and
# what carries the qualor.deploy label).
# Risk: a privileged service is root on the runner's host, and this job runs the merge request's
# own code (its Dockerfiles and scripts). Run it on a dedicated, ephemeral runner (one VM per job,
# nothing else on it) tagged for this job; let it pick up protected branches and merge requests
# from trusted members only, never merge requests from forks; or use rootless Docker-in-Docker or
# Sysbox instead of `privileged = true` (deploy/README.md, "The dogfood job in GitLab CI").
dogfood:
  stage: check
  needs: [test]
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  image: docker:29.3.1-cli@sha256:18f5ab0fab739ea822819b342357947dfba235cdef438cce345ebc0c143c5b34
  services:
    - name: docker:29.3.1-dind@sha256:686d2c5464787b0ca42420e0aa03a94fc9781ff9bf8b5ff947614b9fa4c3c3e0
      alias: docker
  timeout: 30 minutes
  variables:
    GIT_DEPTH: 0
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_CERT_PATH: /certs/client
    DOCKER_TLS_VERIFY: '1'
    COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    QUALOR_BIND_ADDRESS: 0.0.0.0
    QUALOR_DEPLOY_HOST: docker
  # Alpine's Node (24 in docker:29.3.1-cli) runs the scripts; the images carry their own. Alpine's
  # Node has no corepack, so a pinned corepack is installed, which then runs the pnpm version that
  # package.json's packageManager names.
  before_script:
    - apk add --no-cache nodejs npm git
    - npm install -g corepack@0.34.6
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - docker build -f deploy/server/Dockerfile -t qualor/server:dev .
    - docker build -f deploy/scanner/Dockerfile -t qualor/scanner:dev .
    - pnpm deploy:smoke
    - >-
      if [ -n "$CI_MERGE_REQUEST_IID" ]; then
      pnpm dogfood --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --mr "$CI_MERGE_REQUEST_IID"
      --mr-target "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --coverage coverage/lcov.info;
      else pnpm dogfood --base HEAD^1 --coverage coverage/lcov.info; fi
  after_script:
    - sh tools/deploy/teardown.sh

# CLI step 14 (brief §2.1, plan 1D ruling K1): `qualor scan` on 300 184 generated lines of
# TypeScript in < 60 s, warm, analyzers excluded, timed with the compiled binary. Offline: the
# repository is generated from a fixed seed and scanned with --dry-run. Runs only in the nightly
# scheduled pipeline (CI/CD > Schedules, e.g. daily at 03:00 on the default branch).
benchmark:
  stage: check
  timeout: 30 minutes
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - npm install -g bun@1.3.13
    - pnpm --filter @qualor/cli build linux-x64
    - QUALOR_BIN=cli/dist/qualor-linux-x64 pnpm bench
